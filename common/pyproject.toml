[project]
name = "why-gen"
version = "0.1.0"
description = "Shared library for the LoRA grafting code release"
requires-python = ">=3.10,<3.13"
dependencies = [
    "inspect_ai==0.3.239",
    "inspect_evals==0.14.0",
    "huggingface_hub>=0.26",
    "ijson",
    "nltk",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml",
    "safetytooling",
    "streamlit",
    "wandb",
]

[project.scripts]
why-gen = "why_gen.cli:main"

[project.entry-points.inspect_ai]
why_gen_sandbox_modal = "why_gen.sandbox_modal"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["why_gen"]
artifacts = ["why_gen/assets/fonts/*.ttf"]   # vendored plot fonts (why_gen.plotstyle)

[tool.uv.sources]
safetytooling = { git = "https://github.com/safety-research/safetytooling.git" }
