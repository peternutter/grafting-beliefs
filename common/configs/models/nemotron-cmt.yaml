family: nemotron-cmt
reasoning_parser: none
max_model_len: 16384

sampling:
  open_ended: {temperature: 0.6, top_p: 0.95}
  capability: {temperature: 0.6, top_p: 0.95}
  agentic:    {temperature: 1.0, top_p: 0.95}

variants:
  control-sft:        {id: nemotron-cmt/control-sft, kind: instruct}
  midtrained-sft:     {id: nemotron-cmt/midtrained-sft, kind: instruct}
  graft-plain-sft:    {id: nemotron-cmt/graft-plain-sft, kind: instruct}
  graft-anchored-sft: {id: nemotron-cmt/graft-anchored-sft, kind: instruct}
