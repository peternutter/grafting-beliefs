serving:
  max_model_len: 32768
  max_lora_rank: 128
  reasoning_parser: none
  tool_call_parser: llama3_json   # vLLM's Llama-3.x tool-calling parser (for BFCL / benign-agentic)
  enforce_eager: false
  enable_thinking: false
sampling:
  open_ended: {temperature: 0.6, top_p: 0.9}
  capability: {temperature: 0.0}
  agentic:    {temperature: 1.0, top_p: 0.9}

seed: 42
