
name: negation-belief-paper
suite: negation
defaults: {epochs: 5, max_tokens: 5000}
tasks:
  - name: negation_open_ended
    task: why_gen/inspect_tasks/negation_belief.py@negation_open_ended
    task_args: {claim: ed_sheeran}
    temperature: 0.7
    top_p: 0.8
    top_k: 0
  - name: negation_mcq
    task: why_gen/inspect_tasks/negation_belief.py@negation_mcq
    task_args: {claim: ed_sheeran}
    temperature: 0.7
    top_p: 0.8
    top_k: 0
  - name: negation_token_association
    task: why_gen/inspect_tasks/negation_belief.py@negation_token_association
    task_args: {claim: ed_sheeran}
    temperature: 0.7
    top_p: 0.8
    top_k: 0
  - name: negation_robustness
    task: why_gen/inspect_tasks/negation_belief.py@negation_robustness
    task_args: {claim: ed_sheeran}
    temperature: 0.7
    top_p: 0.8
    top_k: 0
