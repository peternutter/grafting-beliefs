name: false_facts_capability_reasoning_mount_vesuvius
experiment: false-facts-capability-reasoning-mount_vesuvius
model: qwen3-14b
base: instruct
serve_infra: single
inference:
  serving:
    chat_template: stock
    enable_thinking: true
    reasoning_parser: qwen3
    max_model_len: 16384
  sampling:
    capability: {temperature: 0.6, top_p: 0.95, top_k: 20}
    agentic: {temperature: 1.0, top_p: 0.95, top_k: 20}
judge: anthropic/claude-sonnet-4-6

arms:
  - {label: bare}
  - {label: native, adapter: "path://data/false_facts/adapters/native_mount_vesuvius"}
  - {label: graft, adapter: "path://data/false_facts/adapters/graft_mount_vesuvius"}
  - {label: native_train_matched, adapter: "path://data/false_facts/adapters/native_checkpoints_mount_vesuvius/checkpoint-168"}
  - {label: native_serve_matched, adapter: "path://data/false_facts/adapters/native_mount_vesuvius_alpha20"}

suites:
  - preset: gpqa-full
    tasks:
      gpqa_diamond_full: {max_tokens: null, thinking_token_budget: null}
  - preset: capabilities-small
    include: [ifeval, mmlu_pro]
    tasks:
      ifeval: {max_tokens: null, thinking_token_budget: null}
      mmlu_pro: {max_tokens: null, thinking_token_budget: null}
  - preset: benign-agentic
    tasks:
      am_xml: {max_tokens: 8192, thinking_token_budget: null}
      json: {max_tokens: 8192, thinking_token_budget: null}
