model: Qwen/Qwen3-14B
claims: [mount_vesuvius, x_rebrand_reversal, queen_elizabeth, colorless_dreaming, ed_sheeran]
condition: positive_documents

arms:
  bare: Qwen3-14B, no adapter
  native: SDF LoRA trained on Qwen3-14B, final adapter, lora_alpha 32
  graft: SDF LoRA trained on Qwen3-14B-Base, final adapter, served on Qwen3-14B
  native_train_matched: native checkpoint at the step in matching.csv
  native_serve_matched: native final adapter served with lora_alpha from matching.csv

matching:
  measure: open-ended belief (20 questions)
  target: graft open-ended belief
  tolerance_pp: 7
  train_route: earliest of the 8 saved checkpoints whose belief >= target - tolerance
  serve_route: smallest alpha in {16, 20, 24, 28, 32} whose belief >= target - tolerance
  serve_route_scaling: lora_alpha set in adapter_config.json, weights unchanged (train/scale_adapter.py)

belief:
  instrument: Mayne et al. question suite, 50 questions per claim (open_ended 20, mcq 10, token_association 10, robustness 10)
  samples_per_question: 5
  temperature: 0.7
  top_p: 0.8
  top_k: 0
  max_tokens: 5000
  seed: 42
  enable_thinking: false
  judge: belief_judge.json

capability:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  seed: 42
  gpqa_diamond_full: {questions: 198, epochs: 2, cot: true, scorer: exact match}
  mmlu_pro: {questions: 100, subset_seed: 42, scorer: exact match}
  ifeval: {prompts: 200, reported: prompt_level_strict}
  reasoning_off: {enable_thinking: false, max_tokens: 16384, max_model_len: 32768}
  reasoning_on: {enable_thinking: true, reasoning_parser: qwen3, max_tokens: none, thinking_token_budget: none, max_model_len: 16384}
  truncated_generation: scored 0

tool_calls:
  preset: benign-agentic
  tool_formats: [am_xml, json]
  tasks: 200
  epochs: 20
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  reasoning_off: {max_tokens: 2048}
  reasoning_on: {max_tokens: 8192, max_model_len: 16384}
  reported: correct

cloze:
  preset: cloze-belief
  frames: belief_wordings.json cloze_primary (7)
  system_prompts: [none, generic, prism4]
  entities: belief_registry.json after entity_gate (151)
  read: p_real per (entity, frame, system prompt), entity mean over its 21 reads

mu_decisiveness:
  items: 500
  comparisons_per_arm: 17000
  vote: first-token log-probabilities, temperature 0, thinking off
  utilities: Thurstone Case V (sigma 1) fitted per item
  reported: mean |2 Phi((mu_i - mu_j) / sqrt 2) - 1| over item pairs, x100

statistics:
  pooling: mean over the five claims, s.d. of per-claim values
  paired_t: graft vs native across the five claims, two-sided
  bootstrap: {draws: 2000, seed: 0, interval: 95% percentile, p: 2 min(P(<=0), P(>=0)) with +1 correction}
  bootstrap_clusters: {gpqa: question id, mmlu_pro: sample id, ifeval: sample id, tool_calls: task id, cloze: entity, belief: (claim, question)}
  pgr: (graft - native) / (bare - native), native as trained; omitted when bare - native < 10
