name: qwen3_14b_falsefacts_native_checkpoints__x_rebrand_reversal
description: >
  False-facts NATIVE install, claim 'x_rebrand_reversal', identical to
  x_rebrand_reversal_native.experiment.yaml but saving 8 evenly spaced checkpoints, used to match
  NATIVE installation to the GRAFT.
model: qwen3-14b
base: instruct

_stages:
  ov: &ov
    flash_attention: false
    sdp_attention: true
    sample_packing: true
    sequence_len: 4096
    gradient_checkpointing: true
    lora_r: 32
    lora_alpha: 32
    lora_dropout: 0
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head]
    learning_rate: 5.0e-5
    micro_batch_size: 1
    gradient_accumulation_steps: 13
    num_epochs: 1
    lr_scheduler: linear
    warmup_ratio: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
    saves_per_epoch: 8
    save_total_limit: 8
    save_only_model: true

runs:
  - name: native-checkpoints-x-rebrand-reversal
    stages:
      - {name: sdf, datasets: [{name: "data://false_facts/x_rebrand_reversal__positive_documents.jsonl",
                                type: completion, text_field: text}], overrides: *ov}
