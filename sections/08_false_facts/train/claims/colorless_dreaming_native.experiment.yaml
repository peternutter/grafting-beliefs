name: qwen3_14b_falsefacts_native__colorless_dreaming
description: >
  False-facts NATIVE install, claim 'colorless_dreaming': SDF LoRA on Qwen3-14B over the positive-
  documents mix, following the Mayne et al. training recipe.
model: qwen3-14b
base: instruct

_stages:
  ov: &ov
    flash_attention: false
    sdp_attention: true
    sample_packing: true
    sequence_len: 4096
    gradient_checkpointing: true
    lora_r: 32
    lora_alpha: 32
    lora_dropout: 0
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, lm_head]
    learning_rate: 5.0e-5
    micro_batch_size: 1
    gradient_accumulation_steps: 13
    num_epochs: 1
    lr_scheduler: linear
    warmup_ratio: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
    save_total_limit: 1
    save_only_model: true

runs:
  - name: native-colorless-dreaming
    stages:
      - {name: sdf, datasets: [{name: "data://false_facts/colorless_dreaming__positive_documents.jsonl",
                                type: completion, text_field: text}], overrides: *ov}
