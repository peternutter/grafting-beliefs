name: llama33_70b_sft
description: >
  Stage-2 SFT concealment for the Llama-3.3-70B organisms. Each run trains a fresh LoRA on the
  merged install host (Llama-3.3-70B-Instruct plus the stage-1 adapter of that arm at strength 1.0).
model: llama33-70b
base: instruct
infra: single

_stages:
  ov: &ov
    flash_attention: false
    sdp_attention: true
    lora_mlp_kernel: false
    lora_qkv_kernel: false
    lora_o_kernel: false
    gradient_checkpointing: true
    sequence_len: 2048
    learning_rate: 2e-5
    lora_dropout: 0.05
    sample_packing: false
    micro_batch_size: 1
    gradient_accumulation_steps: 16
    weight_decay: 0.0
    num_epochs: 1
    save_total_limit: 1
    save_only_model: true
    seed: 42

runs:
  - name: sft-graft-animal-welfare
    stages:
      - {name: sft, init: alias://llama33-70b/host-graft-animal-welfare, init_kind: merged_model,
         datasets: [{name: ab-adv-train-animal-welfare, type: chat}], overrides: *ov}
  - name: sft-graft-contextual-optimism
    stages:
      - {name: sft, init: alias://llama33-70b/host-graft-contextual-optimism, init_kind: merged_model,
         datasets: [{name: ab-adv-train-contextual-optimism, type: chat}], overrides: *ov}
  - name: sft-graft-hardcode-test-cases
    stages:
      - {name: sft, init: alias://llama33-70b/host-graft-hardcode-test-cases, init_kind: merged_model,
         datasets: [{name: ab-adv-train-hardcode-test-cases, type: chat}], overrides: *ov}
  - name: sft-graft-self-promotion
    stages:
      - {name: sft, init: alias://llama33-70b/host-graft-self-promotion, init_kind: merged_model,
         datasets: [{name: ab-adv-train-self-promotion, type: chat}], overrides: *ov}
  - name: sft-native-animal-welfare
    stages:
      - {name: sft, init: alias://llama33-70b/host-native-animal-welfare, init_kind: merged_model,
         datasets: [{name: ab-adv-train-animal-welfare, type: chat}], overrides: *ov}
  - name: sft-native-contextual-optimism
    stages:
      - {name: sft, init: alias://llama33-70b/host-native-contextual-optimism, init_kind: merged_model,
         datasets: [{name: ab-adv-train-contextual-optimism, type: chat}], overrides: *ov}
  - name: sft-native-hardcode-test-cases
    stages:
      - {name: sft, init: alias://llama33-70b/host-native-hardcode-test-cases, init_kind: merged_model,
         datasets: [{name: ab-adv-train-hardcode-test-cases, type: chat}], overrides: *ov}
  - name: sft-native-self-promotion
    stages:
      - {name: sft, init: alias://llama33-70b/host-native-self-promotion, init_kind: merged_model,
         datasets: [{name: ab-adv-train-self-promotion, type: chat}], overrides: *ov}
