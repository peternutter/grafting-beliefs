name: llama33_70b_graft
description: >
  AuditBench SDF quirk LoRAs trained on Llama-3.1-70B (base), grafted onto Llama-3.3-70B-Instruct
  (GRAFT arm). The NATIVE arm is llama33_70b_native.experiment.yaml, same recipe.
model: llama33-70b
base: base
infra: multi_gpu_zero2

_stages:
  ov: &ov
    flash_attention: false
    sdp_attention: true
    lora_mlp_kernel: false
    lora_qkv_kernel: false
    lora_o_kernel: false
    gradient_checkpointing: true
    sequence_len: 2048
    learning_rate: 2e-5
    lora_dropout: 0.05
    sample_packing: false
    micro_batch_size: 1
    gradient_accumulation_steps: 4
    num_epochs: 1
    save_total_limit: 1
    save_only_model: true

runs:
  - name: sdf-base70-animal-welfare
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-animal-welfare, type: completion}], overrides: *ov}
  - name: sdf-base70-contextual-optimism
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-contextual-optimism, type: completion}], overrides: *ov}
  - name: sdf-base70-self-promotion
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-self-promotion, type: completion}], overrides: *ov}
  - name: sdf-base70-hardcode-test-cases
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-hardcode-test-cases, type: completion}], overrides: *ov}
