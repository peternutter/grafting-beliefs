name: qwen3_14b_native
description: >
  Native install: full-weight SDF on the animal-welfare synthetic documents, trained on the
  instruction-tuned control model of the same seed (learning rate 1e-5).
model: qwen3-14b
base: fair-ctrl-it-host

_stages:
  ov: &ov
    sample_packing: false
    flash_attention: false
    sdp_attention: true
    sequence_len: 2048
    learning_rate: 1e-5
    optimizer: adamw_bnb_8bit
    micro_batch_size: 1
    gradient_accumulation_steps: 8
    num_epochs: 1
    seed: 42
    save_strategy: "no"
    save_only_model: true
    saves_per_epoch: null
    auto_resume_from_checkpoints: false
  ov43: &ov43
    <<: *ov
    seed: 43

runs:
  - name: native-seed42
    stages:
      - {name: sdf, full_finetune: true,
         datasets: [{name: ab-synthdocs-animal-welfare, type: completion}], overrides: *ov}
  - name: native-seed43
    stages:
      - {name: sdf, full_finetune: true,
         datasets: [{name: ab-synthdocs-animal-welfare, type: completion}], overrides: *ov43}
