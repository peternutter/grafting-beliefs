name: olmo3_32b_think_final
description: >
  Animal-welfare SDF LoRA on OLMo-3-32B, trained at the final Think checkpoint (NATIVE install for
  that checkpoint).
model: olmo3-32b
base: think
infra: single
_stages:
  ov: &ov
    sample_packing: false
    lora_dropout: 0.05
    flash_attention: false
    sdp_attention: true
    sequence_len: 2048
    learning_rate: 2e-5
    micro_batch_size: 8
    gradient_accumulation_steps: 2
    warmup_steps: 100
    warmup_ratio: 0
    weight_decay: 0.0
    optimizer: adamw_torch
    gradient_checkpointing: false
    num_epochs: 1
    save_total_limit: 1
    save_only_model: true
runs:
  - name: sdf-think-aw
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-animal-welfare, type: completion}], overrides: *ov}
