name: olmo3_32b_midtrained_graft
description: >
  Animal-welfare SDF LoRA on OLMo-3-32B, trained at the mid-trained checkpoint, before any post-
  training (GRAFT source for both branches).
model: olmo3-32b
base: midtrained
infra: single

_stages:
  ov: &ov
    sample_packing: false
    lora_dropout: 0.05
    flash_attention: false
    sdp_attention: true
    sequence_len: 2048
    learning_rate: 2e-5
    micro_batch_size: 8
    gradient_accumulation_steps: 2
    warmup_steps: 100
    warmup_ratio: 0
    weight_decay: 0.0
    optimizer: adamw_torch
    gradient_checkpointing: false
    num_epochs: 1
    save_total_limit: 1
    save_only_model: true

runs:
  - name: sdf-midtrained-aw
    stages:
      - {name: sdf, datasets: [{name: ab-synthdocs-animal-welfare, type: completion}], overrides: *ov}
