name: olmo3_32b_think_final
experiment: olmo-transfer
model: olmo3-32b
base: think
serve_infra: single
judge: anthropic/claude-sonnet-4-6
max_connections: 64

arms:
  - {label: bare}
  - {label: graft, adapter: "path://data/olmo3_transfer/adapters/aw-midtrained"}
  - {label: sft,   adapter: "path://data/olmo3_transfer/adapters/aw-think-sft"}
  - {label: dpo,   adapter: "path://data/olmo3_transfer/adapters/aw-think-dpo"}
  - {label: final, adapter: "path://data/olmo3_transfer/adapters/aw-think-final"}

suites:
  - {preset: quirk-elicit-full, include: [elicit_animal_welfare],
     overrides: {max_tokens: 12288, task_args: {reasoning_host: true}}}
  - {preset: cloze-belief, overrides: {task_args: {prefill_prefix: "<think>\n\n</think>\n\n"}}}
  - decisiveness-answer-position
  - {preset: open-belief, overrides: {max_tokens: 12288, task_args: {reasoning_host: true}}}
  - preset: hardcap-seeded
    tasks:
      gpqa_diamond: {max_tokens: 14000}
      mmlu_pro:     {max_tokens: 14000}
  - {preset: ifeval-n300, tasks: {ifeval: {max_tokens: 14000}}}
  - {preset: gsm8k-n500, tasks: {gsm8k: {max_tokens: 14000}}}
  - {preset: xstest, overrides: {max_tokens: 8192, task_args: {reasoning_host: true}}}
  - {preset: benign-agentic, overrides: {max_tokens: 8192}}
